name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-vet-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        # -short 跳过长跑 demo 循环测试；集成测试默认 skip（GO_TOOLS_TEST_INTEGRATION 未开启）
        run: go test -short -timeout 300s ./...
